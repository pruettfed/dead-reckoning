services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: dvd
      POSTGRES_PASSWORD: dvd
      POSTGRES_DB: dvd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvd -d dvd"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # These override env_file so the compose-internal DB hostname is always used.
      # Secrets (API keys) come from ./backend/.env and are never written here.
      DATABASE_URL: postgresql+asyncpg://dvd:dvd@db:5432/dvd
      CORS_ORIGINS: http://localhost:5173
      ENV: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    profiles: ["frontend"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
